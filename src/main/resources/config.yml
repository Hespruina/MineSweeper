# MineSweeper v4.0 配置文件
# 奖励逻辑由 scripts/*.lgs 脚本文件定义（LogicStep 语言），不再使用 YAML 步骤。
# 详见 DESIGN_LGS.md。

game:
  auto_flag_enabled: false
  timeout_seconds: 60

rewards:
  # 胜利时执行的流程列表
  win:
    # 流程 1：金币奖励（vars 绑定避免重复求值）
    - trigger: "logic:has_reward_permission"
      vars:
        amount: "logic:jiangli"
      actions:
        - type: console_command
          command: "eco give {player} {amount}"
        - type: message
          message: "&6金币奖励：{amount}"
    # 流程 2：生成奖励箱
    - vars:
        bonus_msg: "&e额外奖励已发放"
      actions:
        - type: give_chest
          use_logic: "reward_chest_items"
        - type: message
          message: "&a你获得了奖励箱！{bonus_msg}"
  # 失败时执行的流程
  lose:
    - actions:
        - type: message
          message: "&c很遗憾，你输了！"

logic:
  max_steps: 50000
  max_eval_ms: 50
  constants:
    base_eco: 100
