# MineSweeper 配置文件
game:
  auto_flag_enabled: false
  timeout_seconds: 60

rewards:
  win:
    - trigger: "logic:has_reward_permission"
      vars:
        amount: "logic:jiangli"
      actions:
        - type: console_command
          command: "eco give {player} {amount}"
        - type: message
          message: "&6金币奖励：{amount}"
    - vars:
        bonus_msg: "&e额外奖励已发放"
      actions:
        - type: give_chest
          use_logic: "reward_chest_items"
        - type: message
          message: "&a你获得了奖励箱！{bonus_msg}"
  lose:
    - actions:
        - type: message
          message: "&c很遗憾，你输了！"

logic:
  max_steps: 50000
  max_eval_ms: 50
  constants:
    base_eco: 100
  functions:
    has_reward_permission:
      steps:
        - get_player:
            out: pname
        - check_permission:
            target: has_perm
            permission: "minesweeper.reward"
        - return: "{has_perm}"

    # 金币计算（阶梯公式 + 封顶 + 自动插旗折扣）
    jiangli:
      steps:
        - get_difficulty:
            out: diff
        - get_platform_size:
            out: size
        - get_auto_flag:
            out: autoflag
        - eval:
            target: base_100
            expression: "{diff} == 1 ? 6 : ({diff} == 2 ? 12 : 20)"
        - eval:
            target: inc
            expression: "{diff} == 1 ? 0.4 : ({diff} == 2 ? 0.7 : 1.0)"
        - eval:
            target: extra
            expression: "max(0, {size} - 100) * {inc}"
        - eval:
            target: raw_gold
            expression: "{base_100} + {extra}"
        - eval:
            target: max_limit
            expression: "{diff} == 1 ? 45 : ({diff} == 2 ? 80 : 150)"
        - eval:
            target: capped
            expression: "min({raw_gold}, {max_limit})"
        - eval:
            target: gold
            expression: "floor({capped} * ({autoflag} == 1 ? ({diff} / ({diff} + 1)) : 1))"
        - check_permission:
            target: has_perm
            permission: "group.default"
        - if:
            condition: "{has_perm} == 1"
            then:
              - random_chance:
                  target: lucky
                  percent: 90
              - if:
                  condition: "{lucky} == 1"
                  then:
                    - set:
                        target: eco_value
                        value: "{gold}"
                  else:
                    - set:
                        target: eco_value
                        value: 0
            else:
              - set:
                  target: eco_value
                  value: 0
        - return: "{eco_value}"

    # 奖励箱主函数：混凝土保底 + 矿物 + TNT
    reward_chest_items:
      steps:
        - get_difficulty:
            out: diff
        - get_platform_size:
            out: size
        - get_auto_flag:
            out: autoflag
        # 计算混凝土权重等级（增加上限保护）
        - set:
            target: level
            value: 0
        - if:
            condition: "{diff} == 1"
            then:
              - set:
                  target: level
                  value: 1
        - if:
            condition: "{diff} == 2"
            then:
              - set:
                  target: level
                  value: 2
        - if:
            condition: "{diff} == 3"
            then:
              - set:
                  target: level
                  value: 3
        - if:
            condition: "{size} > 100"
            then:
              - eval:
                  target: level
                  expression: "{level} + 1"
        - if:
            condition: "{size} <= 50"
            then:
              - eval:
                  target: level
                  expression: "{level} - 1"
        - if:
            condition: "{autoflag} == 1"
            then:
              - eval:
                  target: level
                  expression: "{level} - 1"
        - if:
            condition: "{level} < 0"
            then:
              - set:
                  target: level
                  value: 0
        - if:
            condition: "{level} > 3"
            then:
              - set:
                  target: level
                  value: 3
        # 获取随机彩色混凝土列表
        - call: weighted_item_list
          with: [level]
          out: concrete_items
        # 获取矿物列表（新规则）
        - call: calc_minerals
          with: [diff, size, autoflag]
          out: mineral_items
        # 合并列表
        - set:
            target: all_items
            value: "{concrete_items}"       # 复制混凝土列表（引擎会自动处理）
        - for_each:
            target: mineral_items
            var: entry
            do:
              - list_add:
                  target: all_items
                  value: "{entry}"
        # 统计混凝土数量
        - set:
            target: concrete_total
            value: 0
        - for_each:
            target: all_items
            var: entry
            do:
              - eval:
                  target: parts
                  expression: 'split({entry}, ":")'
              - list_get:
                  target: parts
                  index: 0
                  out: mat
              - list_get:
                  target: parts
                  index: 1
                  out: amt_str
              - eval:
                  target: amt
                  expression: "to_number({amt_str})"
              - eval:
                  target: is_conc
                  expression: '"{mat}" contains "CONCRETE"'
              - if:
                  condition: "{is_conc} == 1"
                  then:
                    - eval:
                        target: concrete_total
                        expression: "{concrete_total} + {amt}"
        # 混凝土保底
        - eval:
            target: min_concrete
            expression: "floor({autoflag} == 1 ? {size} * 0.2 : {size} * 0.3)"
        - eval:
            target: need
            expression: "max(0, {min_concrete} - {concrete_total})"
        - if:
            condition: "{need} > 0"
            then:
              - set:
                  target: counter
                  value: 0
              - while:
                  condition: "{counter} < {need}"
                  do:
                    - call: random_concrete
                      out: rand_mat
                    - eval:
                        target: new_entry
                        expression: '"{rand_mat}" + ":1"'
                    - list_add:
                        target: all_items
                        value: "{new_entry}"
                    - eval:
                        target: counter
                        expression: "{counter} + 1"
        # 最终混凝土数量（保底后）
        - eval:
            target: concrete_total
            expression: "max({concrete_total}, {min_concrete})"
        # 添加 TNT
        - eval:
            target: tnt_amt
            expression: "floor({concrete_total} / 2)"
        - if:
            condition: "{tnt_amt} > 0"
            then:
              - eval:
                  target: tnt_entry
                  expression: '"TNT:" + {tnt_amt}'
              - list_add:
                  target: all_items
                  value: "{tnt_entry}"
        - return: "{all_items}"

    # 仅生成随机彩色混凝土（移除了铁/金/钻石）
    weighted_item_list:
      parameters: [reward_level]
      steps:
        - if:
            condition: "{global.weights_init} != 1"
            then:
              - set:
                  target: global.weights_init
                  value: 1
              - list_create:
                  target: global.mats
              - list_add:
                  target: global.mats
                  value: "WHITE_CONCRETE"
              - set:
                  target: global.w_WHITE_CONCRETE
                  value: [20, 40, 60, 80]
        - list_create:
            target: result
        - set:
            target: i
            value: 0
        - list_size:
            target: global.mats
            out: mat_count
        - while:
            condition: "{i} < {mat_count}"
            do:
              - list_get:
                  target: global.mats
                  index: "{i}"
                  out: mat_name
              - eval:
                  target: weight_key
                  expression: '"global.w_" + {mat_name}'
              - set:
                  target: weight_array
                  value: "{$weight_key}"
              - list_get:
                  target: weight_array
                  index: "{reward_level}"
                  out: weight
              - random_int:
                  target: rand
                  min: 1
                  max: 100
              - if:
                  condition: "{rand} <= {weight}"
                  then:
                    - call: random_concrete
                      out: mat_name
                    - call: item_amount
                      with: [mat_name, reward_level]
                      out: amt
                    - eval:
                        target: entry
                        expression: '"{mat_name}" + ":" + {amt}'
                    - list_add:
                        target: result
                        value: "{entry}"
              - eval:
                  target: i
                  expression: "{i} + 1"
        - return: "{result}"

    # 矿物规则计算
    calc_minerals:
      parameters: [diff, size, autoflag]
      steps:
        - list_create:
            target: items
        # 简单模式（难度1）
        - if:
            condition: "{diff} == 1"
            then:
              - eval:
                  target: iron
                  expression: "max(0, floor(2 + 0.06 * ({size} - 100)))"
              - if:
                  condition: "{iron} > 0"
                  then:
                    - eval:
                        target: entry
                        expression: '"IRON_INGOT:" + {iron}'
                    - list_add:
                        target: items
                        value: "{entry}"
        # 中等模式（难度2）
        - if:
            condition: "{diff} == 2"
            then:
              - if:
                  condition: "{autoflag} == 0"
                  then:
                    - eval:
                        target: iron
                        expression: "max(0, floor(5 + 0.15 * ({size} - 100)))"
                    - eval:
                        target: gold
                        expression: "max(0, floor(2 + 0.06 * ({size} - 100)))"
                  else:
                    - eval:
                        target: iron
                        expression: "max(0, floor(4 + 0.14 * ({size} - 100)))"
                    - eval:
                        target: gold
                        expression: "max(0, floor(1 + 0.02 * ({size} - 100)))"
              - if:
                  condition: "{iron} > 0"
                  then:
                    - eval:
                        target: e
                        expression: '"IRON_INGOT:" + {iron}'
                    - list_add:
                        target: items
                        value: "{e}"
              - if:
                  condition: "{gold} > 0"
                  then:
                    - eval:
                        target: e
                        expression: '"GOLD_INGOT:" + {gold}'
                    - list_add:
                        target: items
                        value: "{e}"
        # 困难模式（难度3）
        - if:
            condition: "{diff} == 3"
            then:
              - if:
                  condition: "{size} >= 500"
                  then:
                    - if:
                        condition: "{autoflag} == 0"
                        then:
                          - eval:
                              target: iron
                              expression: "floor(200 + 0.6 * ({size} - 500))"
                          - eval:
                              target: gold
                              expression: "floor(50 + 0.1 * ({size} - 500))"
                          - eval:
                              target: diamond
                              expression: "floor(15 + 0.03 * ({size} - 500))"
                          - eval:
                              target: netherite
                              expression: "floor(4 + 0.008 * ({size} - 500))"
                        else:
                          - eval:
                              target: iron
                              expression: "floor(200 + 0.5 * ({size} - 500))"
                          - eval:
                              target: gold
                              expression: "floor(32 + 0.096 * ({size} - 500))"
                          - eval:
                              target: diamond
                              expression: "floor(10 + 0.03 * ({size} - 500))"
                          - eval:
                              target: netherite
                              expression: "floor(2 + 0.008 * ({size} - 500))"
                  else:
                    - if:
                        condition: "{autoflag} == 0"
                        then:
                          - eval:
                              target: iron
                              expression: "max(0, floor(10 + 0.2 * ({size} - 100)))"
                          - eval:
                              target: gold
                              expression: "max(0, floor(5 + 0.05 * ({size} - 100)))"
                          - eval:
                              target: diamond
                              expression: "max(0, floor(1 + 0.02 * ({size} - 100)))"
                        else:
                          - eval:
                              target: iron
                              expression: "max(0, floor(10 + 0.1 * ({size} - 100)))"
                          - eval:
                              target: gold
                              expression: "max(0, floor(5 + 0.01 * ({size} - 100)))"
                          - eval:
                              target: diamond
                              expression: "max(0, floor(0 + 0.01 * ({size} - 100)))"
                    - set:
                        target: netherite
                        value: 0
              - if:
                  condition: "{iron} > 0"
                  then:
                    - eval:
                        target: e
                        expression: '"IRON_INGOT:" + {iron}'
                    - list_add:
                        target: items
                        value: "{e}"
              - if:
                  condition: "{gold} > 0"
                  then:
                    - eval:
                        target: e
                        expression: '"GOLD_INGOT:" + {gold}'
                    - list_add:
                        target: items
                        value: "{e}"
              - if:
                  condition: "{diamond} > 0"
                  then:
                    - eval:
                        target: e
                        expression: '"DIAMOND:" + {diamond}'
                    - list_add:
                        target: items
                        value: "{e}"
              - if:
                  condition: "{netherite} > 0"
                  then:
                    - eval:
                        target: e
                        expression: '"NETHERITE_INGOT:" + {netherite}'
                    - list_add:
                        target: items
                        value: "{e}"
        - return: "{items}"

    # 随机彩色混凝土
    random_concrete:
      steps:
        - list_create:
            target: colors
        - list_add:
            target: colors
            value: "WHITE_CONCRETE"
        - list_add:
            target: colors
            value: "ORANGE_CONCRETE"
        - list_add:
            target: colors
            value: "MAGENTA_CONCRETE"
        - list_add:
            target: colors
            value: "LIGHT_BLUE_CONCRETE"
        - list_add:
            target: colors
            value: "YELLOW_CONCRETE"
        - list_add:
            target: colors
            value: "LIME_CONCRETE"
        - list_add:
            target: colors
            value: "PINK_CONCRETE"
        - list_add:
            target: colors
            value: "GRAY_CONCRETE"
        - list_add:
            target: colors
            value: "LIGHT_GRAY_CONCRETE"
        - list_add:
            target: colors
            value: "CYAN_CONCRETE"
        - list_add:
            target: colors
            value: "PURPLE_CONCRETE"
        - list_add:
            target: colors
            value: "BLUE_CONCRETE"
        - list_add:
            target: colors
            value: "BROWN_CONCRETE"
        - list_add:
            target: colors
            value: "GREEN_CONCRETE"
        - list_add:
            target: colors
            value: "RED_CONCRETE"
        - list_add:
            target: colors
            value: "BLACK_CONCRETE"
        - list_size:
            target: colors
            out: len
        - random_int:
            target: idx
            min: 0
            max: "{len} - 1"
        - list_get:
            target: colors
            index: "{idx}"
            out: color
        - return: "{color}"

    # 物品数量（混凝土用）
    item_amount:
      parameters: [material, level]
      steps:
        - eval:
            target: base
            expression: "{level} + 1"
        - if:
            condition: '"{material}" contains "CONCRETE"'
            then:
              - random_int:
                  target: amt
                  min: 1
                  max: "{base} + 3"
            else:
              - set:
                  target: amt
                  value: 1
        - return: "{amt}"